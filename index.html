<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Poppins', sans-serif; }
body { overflow:hidden; transition: background 2s ease-in-out; }
#cross { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); font-size: 48px; z-index: 1000; font-weight: 900; color:white; text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #ffd700; transition: color 1s ease; }
#content { position:absolute; width:100%; height:100%; display:flex; justify-content:center; align-items:center; flex-direction:column; text-align:center; color:white; transition: opacity 1.5s ease; }
.gold-text { font-size: 56px; font-weight: bold; font-family:'Cursive', sans-serif; background: linear-gradient(90deg, #FFD700, #FFF4A3, #FFD700); background-size: 200% auto; color: transparent; background-clip: text; animation: shimmer 3s infinite linear; }
@keyframes shimmer { 0% { background-position:0%; } 100% { background-position:200%; } }
.petal, .snow, .butterfly, .rose { position: fixed; pointer-events:none; }
.petal { width: 25px; height: 25px; background-image: url('https://i.imgur.com/8eQXK0R.png'); background-size: cover; animation: fall 6s linear infinite; opacity:0.9; }
.rose { width: 28px; height:28px; background-image: url('https://i.imgur.com/Wp8mFh0.png'); background-size: cover; animation: fall 6s linear infinite; opacity:0.9; }
.butterfly { width:40px; height:40px; background-image:url('https://i.imgur.com/Exd6R0b.png'); background-size:cover; animation: flutter 10s infinite ease-in-out; }
@keyframes fall { from { transform: translateY(-10px) rotate(0deg); } to { transform: translateY(120vh) rotate(360deg); } }
@keyframes flutter { 0%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(20px) rotate(15deg);}100%{transform:translateY(0) rotate(-15deg);} }
.snow { width: 8px; height: 8px; background: white; border-radius:50%; animation: snowFall 7s linear infinite; }
@keyframes snowFall { from{transform:translateY(-10px);} to{transform:translateY(120vh);} }
#surpriseBtn, #verseBtn { padding:12px 22px; border:none; border-radius:8px; font-size:18px; cursor:pointer; display:none; z-index:1001; transition: transform 0.3s ease; }
#surpriseBtn { background:#ff4d6d; color:white; }
#verseBtn { background:#4d94ff; color:white; }
#surpriseBtn:hover, #verseBtn:hover { transform:scale(1.1); }
.fade { opacity:0; transition:opacity 1.5s ease; }
.show { opacity:1; }
.stars { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; }
.star { position:absolute; width:2px; height:2px; background:white; border-radius:50%; opacity:0.8; animation: twinkle 2s infinite alternate; }
@keyframes twinkle { from{opacity:0.3;} to{opacity:1;} }
</style>
</head>
<body>

<div id="cross">✝</div>
<div id="content"></div>
<div id="stars" class="stars"></div>
<button id="surpriseBtn">Tap for Surprise</button>
<button id="verseBtn">Verse for You</button>

<script>
const content = document.getElementById("content");
const cross = document.getElementById("cross");
const btn = document.getElementById("surpriseBtn");
const verseBtn = document.getElementById("verseBtn");
const starsContainer = document.getElementById("stars");

function clearAnimations(className) {
    document.querySelectorAll(`.${className}`).forEach(el => el.remove());
}

function fadeContent(textHtml, color="white") {
    content.classList.remove("show");
    setTimeout(() => {
        content.innerHTML = textHtml;
        content.style.color = color;
        content.classList.add("show");
    }, 300);
}

// Create twinkling stars
function createStars(count=50){
    clearAnimations("star");
    for(let i=0;i<count;i++){
        let star=document.createElement("div");
        star.className="star";
        star.style.top=Math.random()*100+"vh";
        star.style.left=Math.random()*100+"vw";
        star.style.animationDuration=(Math.random()*2+1)+"s";
        starsContainer.appendChild(star);
    }
}

// Night phase with moon & stars
function phaseNight() {
    document.body.style.background = "url('https://i.imgur.com/3GgKMZt.jpeg') center/cover no-repeat"; // realistic night sky with moon
    cross.style.color="white";
    createStars(70);
    fadeContent("<h2 style='font-family:Cursive;'>✨ A blessed night under the moon ✨</h2>");
}

// Day phase with sun
function phaseDay() {
    document.body.style.background = "url('https://i.imgur.com/l2V9B7f.jpeg') center/cover no-repeat"; // day sky with sun
    cross.style.color="black";
    clearAnimations("star");
    fadeContent("<h2 style='font-family:Fantasy;'>🌼 A beautiful new day 🌼</h2>");
}

// Birthday garden phase
function phaseBirthday() {
    document.body.style.background="url('https://i.imgur.com/E6v3s4Q.jpeg') center/cover no-repeat"; // garden background
    cross.style.color="black";
    fadeContent("<div class='gold-text'>Happy Birthday Rachael</div>");
    clearAnimations("petal");
    clearAnimations("rose");
    clearAnimations("butterfly");

    // Petals
    for(let i=0;i<20;i++){
        let petal=document.createElement("div");
        petal.className="petal";
        petal.style.left=Math.random()*100+"vw";
        petal.style.animationDelay=Math.random()*5+"s";
        document.body.appendChild(petal);
    }

    // Roses
    for(let i=0;i<15;i++){
        let rose=document.createElement("div");
        rose.className="rose";
        rose.style.left=Math.random()*100+"vw";
        rose.style.animationDelay=Math.random()*5+"s";
        document.body.appendChild(rose);
    }

    // Butterflies
    for(let i=0;i<5;i++){
        let butterfly=document.createElement("div");
        butterfly.className="butterfly";
        butterfly.style.left=Math.random()*100+"vw";
        butterfly.style.top=Math.random()*50+"vh";
        butterfly.style.animationDelay=Math.random()*5+"s";
        document.body.appendChild(butterfly);
    }

    // Show surprise button
    setTimeout(()=>{ btn.style.display="block"; },1000);
}

// Surprise button click
btn.onclick = function() {
    btn.style.display="none"; // disappear
    phaseFinal();
};

// Final verse phase
function phaseFinal(){
    document.body.style.background="#001652";
    cross.style.color="white";
    fadeContent("<h2 style='font-family:Georgia, serif; color:#FFD700;'>You are the rhythm to my heartbeat, the blessing my prayers found.</h2>");
    clearAnimations("petal");
    clearAnimations("rose");
    clearAnimations("butterfly");
    clearAnimations("snow");

    // Snow effect
    for(let i=0;i<40;i++){
        let snow=document.createElement("div");
        snow.className="snow";
        snow.style.left=Math.random()*100+"vw";
        snow.style.animationDelay=Math.random()*7+"s";
        document.body.appendChild(snow);
    }

    // Show verse button after 2s
    setTimeout(()=>{ verseBtn.style.display="block"; },2000);
}

// Verse button click
verseBtn.onclick = function(){
    verseBtn.style.display="none";
    fadeContent("<h2 style='font-family:Palatino, serif; color:#FFD700;'>“Charm is deceptive, and beauty is fleeting; but a woman who fears the Lord is to be praised.” — Proverbs 31:30</h2>");
}

// Start phases with timing (night 7s, day 9s, birthday 7s)
phaseNight();
setTimeout(phaseDay,7000);
setTimeout(phaseBirthday,16000);
</script>
</body>
</html>

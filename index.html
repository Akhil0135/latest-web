<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Birthday Surprise</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Poppins', sans-serif; }
body { overflow:hidden; transition: background 2s ease-in-out; }
#cross { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); font-size: 38px; z-index: 1000; font-weight: bold; transition: color 1s ease; }
#content { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; text-align: center; color: white; }
.gold-text { font-size: 48px; font-weight: bold; background: linear-gradient(90deg, #FFD700, #FFF4A3, #FFD700); background-size: 200% auto; color: transparent; background-clip: text; animation: shimmer 3s infinite linear; }
@keyframes shimmer { 0% { background-position: 0%; } 100% { background-position: 200%; } }
.petal { position: fixed; top: -10px; width: 25px; height: 25px; background-image: url('https://i.imgur.com/8eQXK0R.png'); background-size: cover; animation: fall 6s linear infinite; opacity: 0.9; }
@keyframes fall { from { transform: translateY(-10px) rotate(0deg); } to { transform: translateY(120vh) rotate(360deg); } }
#surpriseBtn { padding: 12px 22px; background: #ff4d6d; color: white; border: none; border-radius: 8px; font-size: 18px; margin-top: 20px; display: none; cursor: pointer; animation: pop 0.5s ease forwards; }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
.snow { position: fixed; top: -10px; width: 8px; height: 8px; background: white; border-radius: 50%; opacity: 0.9; animation: snowFall 7s linear infinite; }
@keyframes snowFall { from { transform: translateY(-10px); } to { transform: translateY(120vh); } }
</style>
</head>
<body>
<div id="cross">✝</div>
<div id="content"></div>
<script>
const content = document.getElementById("content");
const cross = document.getElementById("cross");

function phase1() {
    document.body.style.background = "url('https://i.imgur.com/X62gV2U.jpeg') center/cover no-repeat";
    cross.style.color = "white";
    content.innerHTML = "<h2>✨ A blessed night... ✨</h2>";
}

function phase2() {
    document.body.style.background = "url('https://i.imgur.com/OuMZlC7.jpeg') center/cover no-repeat";
    cross.style.color = "black";
    content.innerHTML = "<h2>🌼 A beautiful new day... 🌼</h2>";
}

function phase3() {
    document.body.style.background = "white";
    cross.style.color = "black";
    content.innerHTML = `<div class='gold-text'>Happy Birthday Rachael</div>`;
    for (let i=0;i<25;i++){
        let petal=document.createElement("div");
        petal.className="petal";
        petal.style.left=Math.random()*100+"vw";
        petal.style.animationDelay=Math.random()*5+"s";
        document.body.appendChild(petal);
    }
    setTimeout(()=>{document.getElementById("surpriseBtn").style.display="block";},7000);
}

function phase4() {
    document.body.style.background = "#001652";
    cross.style.color = "white";
    content.innerHTML = `<h2 style='color:white;'>\"You are the rhythm to my heartbeat, the blessing my prayers found.\"</h2>`;
    for(let i=0;i<40;i++){
        let snow=document.createElement("div");
        snow.className="snow";
        snow.style.left=Math.random()*100+"vw";
        snow.style.animationDelay=Math.random()*7+"s";
        document.body.appendChild(snow);
    }
}

const btn=document.createElement("button");
btn.id="surpriseBtn";
btn.innerText="Tap for Surprise";
btn.onclick=phase4;
document.body.appendChild(btn);

phase1();
setTimeout(phase2,16000);
setTimeout(phase3,30000);
</script>
</body>
</html>
